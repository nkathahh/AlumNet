name: CI

# Runs the automated tests on every push and pull request to main.
# Each job starts its own empty MySQL database, builds it from the
# migrations and tests the real code against it. Test reports are kept
# as downloadable artifacts on each run, linked to the commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: root
  DB_NAME: alumnet_test

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alumnet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Fails the build if a package the live app uses has a known high or critical vulnerability
      - name: Check packages for known vulnerabilities
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        run: |
          for f in $(find backend/src backend/tests e2e -name '*.js' -not -path '*/node_modules/*') frontend/public/js/main.js; do
            node --check "$f"
          done

      # The same migration runner used on laptops and the live database
      - name: Build the database from the migrations
        working-directory: backend
        run: npm run migrate

      - name: Run API tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=backend-test-results.xml \
            tests/api.test.js

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/backend-test-results.xml

  browser:
    name: Browser checks (XSS and accessibility)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alumnet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          (cd backend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)

      - name: Build the database from the migrations
        working-directory: backend
        run: npm run migrate

      - name: Run browser checks
        working-directory: e2e
        env:
          JWT_SECRET: ci-test-secret
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=browser-test-results.xml \
            browser.test.js

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: e2e/browser-test-results.xml
          if-no-files-found: ignore

  ml-service:
    name: Recommendation service tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alumnet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      # Same Python and packages as the deployed service (see Dockerfile)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ml-service/requirements-deploy.txt
            ml-service/requirements-test.txt

      - name: Install dependencies
        working-directory: ml-service
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-deploy.txt -r requirements-test.txt

      # Known vulnerabilities in the Python packages, reported (not yet failing the build)
      - name: Check packages for known vulnerabilities
        working-directory: ml-service
        run: |
          pip install pip-audit
          pip-audit -r requirements-deploy.txt || echo "::warning::pip-audit found issues, see the log"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Build the database from the migrations
        run: |
          for f in database/migrations/*.sql; do
            mysql -h 127.0.0.1 -P 3306 -uroot -proot alumnet_test < "$f"
          done

      - name: Run recommendation tests
        working-directory: ml-service
        run: python -m pytest -v --junitxml=ml-test-results.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-results
          path: ml-service/ml-test-results.xml