name: Deploy

# Publishes a tested release to the two Hugging Face Spaces: the AlumNet
# server (alumnet-api) and the matching service (alumnet-ml). It runs only
# after the CI workflow has passed on main, so untested code is never
# deployed. Cloudflare Pages deploys the pages itself from main.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   HF_TOKEN      a Hugging Face access token with write access
#   variable HF_USERNAME   your Hugging Face username (or the organisation's)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  spaces:
    name: Publish to Hugging Face Spaces
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever is newest
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare the two Space folders
        run: |
          mkdir -p out/api out/ml
          # Server: its Dockerfile and description, the backend and the migrations (no tests, no secrets)
          cp deploy/api-space/Dockerfile deploy/api-space/README.md deploy/api-space/.dockerignore out/api/
          rsync -a --exclude node_modules --exclude tests --exclude uploads --exclude coverage --exclude '.env' --exclude '.env.*' backend out/api/
          cp backend/.env.example out/api/backend/.env.example
          cp -r database out/api/
          # Matching service: the files its Dockerfile uses
          cp ml-service/Dockerfile ml-service/app.py ml-service/requirements-deploy.txt out/ml/
          cp deploy/ml-space/README.md out/ml/

      - name: Upload to the Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          pip install huggingface_hub==0.26.2
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          owner = os.environ["HF_USERNAME"]
          release = os.environ["RELEASE"][:7]
          for name, folder in [("alumnet-api", "out/api"), ("alumnet-ml", "out/ml")]:
              repo = f"{owner}/{name}"
              api.create_repo(repo, repo_type="space", space_sdk="docker", exist_ok=True)
              # delete_patterns removes files that are no longer in the release
              api.upload_folder(repo_id=repo, repo_type="space", folder_path=folder,
                                commit_message=f"Release {release} from GitHub main", delete_patterns=["*"])
              print(f"Published {release} to https://huggingface.co/spaces/{repo}")
          PY

      - name: Record the release on the run page
        env:
          RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          {
            echo "## Released ${RELEASE:0:7}"
            echo ""
            echo "- Server: https://huggingface.co/spaces/${HF_USERNAME}/alumnet-api"
            echo "- Matching service: https://huggingface.co/spaces/${HF_USERNAME}/alumnet-ml"
            echo "- Pages: deployed by Cloudflare Pages from the same commit on main"
          } >> "$GITHUB_STEP_SUMMARY"