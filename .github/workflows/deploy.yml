name: Deploy

# Publishes a tested release. It runs only after the CI workflow has passed on
# main, so untested code is never deployed. It builds the two containers, the
# AlumNet server (alumnet-api) and the matching service (alumnet-ml), labels
# them with the commit, and stores them in GitHub's container registry (GHCR).
# Azure Container Apps runs them. Cloudflare Pages deploys the pages itself
# from main.
#
# Needs, under Settings > Secrets and variables > Actions:
#   variable MODEL_REVISION     the evaluated commit of BAAI/bge-small-en-v1.5
#   optional secret AZURE_CREDENTIALS, plus variable AZURE_RESOURCE_GROUP:
#     when set, the Container Apps are switched to the new release here.
#     Without them, the run page shows the two commands to run in Azure Cloud Shell.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and publish the containers
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      # The commit CI tested, not whatever is newest
      RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE }}

      - name: Prepare the two build folders
        run: |
          mkdir -p out/api out/ml
          # Server: its Dockerfile, the backend and the migrations (no tests, no secrets)
          cp deploy/api-space/Dockerfile deploy/api-space/.dockerignore out/api/
          rsync -a --exclude node_modules --exclude tests --exclude uploads --exclude coverage --exclude '.env' --exclude '.env.*' backend out/api/
          cp backend/.env.example out/api/backend/.env.example
          cp -r database out/api/
          # Matching service: only the files its Dockerfile uses
          cp ml-service/Dockerfile ml-service/.dockerignore ml-service/app.py ml-service/requirements-deploy.txt out/ml/

      - name: Work out the image names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "API_IMAGE=ghcr.io/${owner}/alumnet-api" >> "$GITHUB_ENV"
          echo "ML_IMAGE=ghcr.io/${owner}/alumnet-ml" >> "$GITHUB_ENV"
          echo "TAG=${RELEASE:0:7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server
        uses: docker/build-push-action@v6
        with:
          context: out/api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.TAG }},${{ env.API_IMAGE }}:latest
          labels: org.opencontainers.image.revision=${{ env.RELEASE }}

      - name: Build and push the matching service
        uses: docker/build-push-action@v6
        with:
          context: out/ml
          push: true
          build-args: MODEL_REVISION=${{ vars.MODEL_REVISION || 'main' }}
          tags: ${{ env.ML_IMAGE }}:${{ env.TAG }},${{ env.ML_IMAGE }}:latest
          labels: org.opencontainers.image.revision=${{ env.RELEASE }}

      - name: Check whether Azure sign-in is set up
        id: azure
        env:
          CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: echo "ready=$([ -n "$CREDS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure
        if: steps.azure.outputs.ready == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Switch the Container Apps to this release
        if: steps.azure.outputs.ready == 'true'
        env:
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az containerapp update --name alumnet-ml --resource-group "$GROUP" --image "$ML_IMAGE:$TAG" --revision-suffix "r$TAG"
          az containerapp update --name alumnet-api --resource-group "$GROUP" --image "$API_IMAGE:$TAG" --revision-suffix "r$TAG"

      - name: Record the release on the run page
        env:
          READY: ${{ steps.azure.outputs.ready }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'alumnet' }}
          MODEL: ${{ vars.MODEL_REVISION || 'main (not pinned)' }}
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "Commit: \`${RELEASE}\`  "
            echo "Model: BAAI/bge-small-en-v1.5 at revision \`${MODEL}\`"
            echo ""
            echo "- Server image: \`${API_IMAGE}:${TAG}\`"
            echo "- Matching service image: \`${ML_IMAGE}:${TAG}\`"
            echo ""
            if [ "$READY" = "true" ]; then
              echo "Both Container Apps were switched to this release."
            else
              echo "To switch the live site to this release, run in Azure Cloud Shell:"
              echo ""
              echo '```'
              echo "az containerapp update --name alumnet-ml --resource-group ${GROUP} --image ${ML_IMAGE}:${TAG}"
              echo "az containerapp update --name alumnet-api --resource-group ${GROUP} --image ${API_IMAGE}:${TAG}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"