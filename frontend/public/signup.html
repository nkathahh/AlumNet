<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — AlumNet</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="auth-shell">
    <div class="auth-visual">
      <div class="auth-topbar">
        <label class="theme-switch" title="Toggle dark mode">
          <input type="checkbox" id="theme-toggle-checkbox">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>

      <div class="cloud" style="width:180px; height:180px; top:15%; left:10%;"></div>
      <div class="cloud" style="width:120px; height:120px; top:45%; left:55%; animation-duration:65s;"></div>
      <div class="cloud" style="width:140px; height:140px; top:70%; left:20%; animation-duration:40s;"></div>

      <div id="flight-path-mount"></div>
      <svg class="aircraft-silhouette" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M482.3 192.4L295.1 192.4L198.2 25.5C193.6 17.6 185.1 12.7 176 12.7C159.8 12.7 147.6 27.5 150.8 43.4L184.9 192.4L95.7 192.4L48.1 125.8C44.8 121.2 39.5 118.4 33.9 118.4C22.8 118.4 14.6 128.7 17 139.6L36.2 234.2L17 328.8C14.6 339.7 22.8 350 33.9 350C39.5 350 44.8 347.2 48.1 342.6L95.7 276L184.9 276L150.8 425C147.6 440.9 159.8 455.7 176 455.7C185.1 455.7 193.6 450.8 198.2 442.9L295.1 276L482.3 276C498.6 276 512 262.6 512 246.3L512 222.1C512 205.8 498.6 192.4 482.3 192.4Z" />
      </svg>

      <div class="auth-visual-brand"><span class="mark">KQ</span> AlumNet</div>

      <div class="auth-visual-copy">
        <h1>Your next connection starts here</h1>
        <p>Join a network of current staff and alumni, matched by shared skills and experience.</p>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-inner">
        <div class="auth-toggle">
          <a href="login.html">Log in</a>
          <a href="signup.html" class="active">Sign up</a>
        </div>

        <h2>Create your alumni account</h2>
        <span class="sub">A few details help AlumNet match you with the right mentors.</span>

        <form id="signup-form" novalidate>
          <div class="field">
            <label for="role">I am a</label>
            <select id="role" name="role" required>
              <option value="">Select one</option>
              <option value="mentee">Current Kenya Airways employee</option>
              <option value="mentor">Former crew / staff (alumnus)</option>
            </select>
          </div>

          <div id="staff-fields" style="display:none;">
            <div class="field">
              <label for="staffNumber">Staff number</label>
              <input type="text" id="staffNumber" name="staffNumber" placeholder="KQ48213">
              <p class="field-hint" id="staff-lookup-status"></p>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" readonly placeholder="Auto-filled after verification">
              </div>
              <div class="field">
                <label for="department">Department</label>
                <input type="text" id="department" readonly placeholder="Auto-filled after verification">
              </div>
            </div>
            <div class="field">
              <label for="idNumberDisplay">ID number / passport no.</label>
              <input type="text" id="idNumberDisplay" readonly placeholder="Auto-filled after verification">
            </div>
          </div>

          <div id="mentee-email-field" style="display:none;" class="field">
            <label for="emailMentee">Kenya Airways email</label>
            <input type="email" id="emailMentee" readonly placeholder="Auto-filled after verification">
          </div>
          <div id="mentor-email-field" style="display:none;">
            <div class="field">
              <label for="emailMentor">Personal email</label>
              <input type="email" id="emailMentor" placeholder="you@gmail.com">
            </div>
            <div class="field">
              <label for="mentorYears">Years of experience at Kenya Airways</label>
              <input type="number" id="mentorYears" min="0" max="50">
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div style="position:relative;">
              <input type="password" id="password" name="password" minlength="8" required>
              <button type="button" id="toggle-password" class="btn-quiet"
                style="position:absolute; right:6px; top:6px; padding:4px 8px;">Show</button>
            </div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" minlength="8" required>
            <p class="field-hint" id="password-match-status"></p>
          </div>

          <div class="field">
            <label for="mobileNumber">Mobile number</label>
            <input type="text" id="mobileNumber" name="mobileNumber" placeholder="+254712345678">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="country">Country</label>
              <input type="text" id="country" name="country" placeholder="Kenya" required>
            </div>
            <div class="field">
              <label for="city">City</label>
              <input type="text" id="city" name="city" placeholder="Nairobi" required>
            </div>
          </div>

          <div class="field"><label for="skills">Skills</label><textarea id="skills" name="skills"></textarea></div>
          <div class="field"><label for="experience">Experience</label><textarea id="experience"
              name="experience"></textarea></div>
          <div class="field"><label for="interests">Career interests</label><textarea id="interests"
              name="interests"></textarea></div>
          <div class="field">
            <label for="industry">Industry</label>
            <select id="industry" name="industry">
              <option>Aviation</option>
              <option>Ground Operations</option>
              <option>Logistics</option>
              <option>Corporate / Support</option>
              <option>Other</option>
            </select>
          </div>

          <p id="signup-error" style="color:var(--kq-red); font-size:0.85rem; display:none; margin-bottom:16px;"></p>
          <button type="submit" class="btn btn-primary btn-block">Sign up</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
