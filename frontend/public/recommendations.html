<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recommended mentors — AlumNet</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app-shell">
    <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="topbar-actions">
      <label class="theme-switch" title="Toggle dark mode">
        <input type="checkbox" id="theme-toggle-checkbox">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
      <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">⏻</button>
    </div>
    <aside class="app-sidebar">
      <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
      <nav id="sidebar-nav"></nav>
      <div class="app-sidebar-foot"></div>
    </aside>

        <main class="app-main">
      <div class="app-header">
        <div>
          <h1>Find a mentor</h1>
          <span class="sub">Retired staff ranked by how well their background matches your profile.</span>
        </div>
      </div>

      <div class="mentor-list" id="mentor-list"></div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
