<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recommended mentors — AlumNet</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app-shell">
    <div class="topbar-actions">
  <label class="theme-switch" title="Toggle dark mode">
    <input type="checkbox" id="theme-toggle-checkbox">
    <span class="switch-track"><span class="switch-thumb"></span></span>
  </label>
  <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">⏻</button>
</div>
    <aside class="app-sidebar">
      <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
      <nav id="sidebar-nav"></nav>
      <div class="app-sidebar-foot"></div>
    </aside>

    <main class="app-main">
      <div class="app-header">
        <div>
          <h1>Recommended mentors</h1>
          <span class="sub">Ranked by how closely their profile matches your skills and career interests.</span>
        </div>
        <div class="app-toolbar">
          <input class="search-pill" type="text" placeholder="Search mentors">
          <select class="select-pill">
            <option>All departments</option>
            <option>Flight Operations</option>
            <option>Cabin Services</option>
            <option>Ground Operations</option>
          </select>
        </div>
      </div>

      <div class="mentor-list" id="mentor-list">
        <!-- mentor cards rendered by js/main.js from MOCK_MENTORS -->
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
