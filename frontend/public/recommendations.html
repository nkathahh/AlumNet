<!DOCTYPE html>
<html lang="en">
<head>

<title>Recommended mentors — AlumNet</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>

    <nav class="nav-group">
      <div class="nav-group-label">Network</div>
      <a class="nav-link active" href="recommendations.html">Mentor recommendations</a>

    <nav class="nav-group">

  <main class="app-main">
