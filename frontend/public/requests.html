<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mentorship requests — AlumNet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <div class="topbar-actions">
            <label class="theme-switch" title="Toggle dark mode">
                <input type="checkbox" id="theme-toggle-checkbox">
                <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
            <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">⏻</button>
        </div>

        <main class="app-main">
            <div class="app-header">
                <div>
                    <h1>Mentorship requests</h1>
                    <span class="sub" id="requests-subtitle"></span>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="pending">Pending</button>
                <button class="tab" data-tab="accepted">Accepted</button>
                <button class="tab" data-tab="declined">Declined</button>
            </div>

            <div id="requests-list"></div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
