<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mentorship requests AlumNet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Menu" aria-expanded="false" aria-controls="app-sidebar">
            <span></span><span></span><span></span>
        </button>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <aside class="app-sidebar" id="app-sidebar">
            <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
            <nav id="sidebar-nav"></nav>
            <div class="app-sidebar-foot"></div>
        </aside>

        <main class="app-main">
            <div class="app-header">
                <div>
                    <h1>Mentorship requests</h1>
                    <span class="sub" id="requests-subtitle"></span>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="pending">Pending</button>
                <button class="tab" data-tab="accepted">Accepted</button>
                <button class="tab" data-tab="ended">Ended</button>
                <button class="tab" data-tab="declined">Declined</button>
            </div>

            <div id="requests-places" class="req-places" hidden></div>
            <div id="requests-tools" class="req-tools" hidden></div>
            <div id="requests-list"></div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
