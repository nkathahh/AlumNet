<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin dashboard — AlumNet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <div class="topbar-actions">
            <label class="theme-switch" title="Toggle dark mode">
                <input type="checkbox" id="theme-toggle-checkbox">
                <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
            <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">⏻</button>
        </div>

        <aside class="app-sidebar">
            <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
            <nav id="sidebar-nav"></nav>
            <div class="app-sidebar-foot"></div>
        </aside>

        <main class="app-main" style="max-width: 100%;">
            <div class="app-header">
                <div>
                    <h1>Admin dashboard</h1>
                    <span class="sub">Platform activity and account management.</span>
                </div>
            </div>

            <div class="stat-row" id="stat-row"></div>


            <div id="admin-tab-users">
                <input type="text" id="admin-user-search" class="search-pill" placeholder="Search by name or email"
                    style="margin-bottom:14px; width:100%; max-width:320px;">
                <div class="table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Joined</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="admin-tab-events" style="display:none;">
                <form id="create-event-form" class="field-row" style="align-items:end; margin-bottom:20px;">
                    <div class="field"><label for="eventTitle">Title</label><input type="text" id="eventTitle" required>
                    </div>
                    <div class="field"><label for="eventDate">Date</label><input type="datetime-local" id="eventDate"
                            required></div>
                    <div class="field-row">
                        <div class="field">
                            <label for="eventMode">Format</label>
                            <select id="eventMode">
                                <option value="in_person">In person</option>
                                <option value="virtual">Virtual</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="eventCapacity">Capacity (optional)</label>
                            <input type="number" id="eventCapacity" min="1">
                        </div>
                    </div>
                    <div class="field">
                        <label for="eventLocation">Venue or meeting link</label>
                        <input type="text" id="eventLocation" placeholder="e.g. Pride Centre, Embakasi or https://...">
                    </div>
                    <p id="event-form-error"
                        style="color:var(--kq-red); font-size:0.85rem; display:none; margin-bottom:12px;"></p>
                    <button type="submit" class="btn btn-primary" style="height:46px;">Add event</button>
                </form>
                <div class="field" style="max-width:none;">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" style="margin-bottom:16px;"></textarea>
                </div>
                <div class="table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Date</th>
                                <th>Description</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="admin-events-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="admin-tab-opportunities" style="display:none;">
                <div id="admin-opportunities-list"></div>
                <div class="section-heading" style="margin-top:32px;">
                    <h2>Event proposals</h2>
                </div>
                <div id="admin-pending-events"></div>
            </div>

            <div id="admin-tab-logs" style="display:none;">
                <div class="table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>When</th>
                                <th>Admin</th>
                                <th>Action</th>
                                <th>Target</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody id="admin-logs-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
