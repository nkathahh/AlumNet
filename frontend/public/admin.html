<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin dashboard — AlumNet</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
    <nav class="nav-group">
      <div class="nav-group-label">Admin</div>
      <a class="nav-link active" href="admin.html">Dashboard</a>
    </nav>
    <div class="app-sidebar-foot">Super Admin</div>
  </aside>

  <main class="app-main" style="max-width: 100%;">
    <div class="app-header">
      <div>
        <h1>Admin dashboard</h1>
        <span class="sub">Platform activity and account management.</span>
      </div>
    </div>

    <div class="stat-row" id="stat-row"></div>

    <table class="data-table">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr>
      </thead>
      <tbody id="admin-table-body"></tbody>
    </table>
  </main>
</div>
<script src="js/main.js"></script>
</body>
</html>
