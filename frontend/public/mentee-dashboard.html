<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mentee Dashboard AlumNet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Menu" aria-expanded="false" aria-controls="app-sidebar">
            <span></span><span></span><span></span>
        </button>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <aside class="app-sidebar" id="app-sidebar">
            <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
            <nav id="sidebar-nav"></nav>
            <div class="app-sidebar-foot"></div>
        </aside>
        <main class="app-main app-main-home">

            <div class="home" id="mentee-dashboard">
                <section class="home-band" aria-labelledby="me-greeting">
                    <div class="home-band-top">
                        <div>
                            <p class="home-date" id="me-date"></p>
                            <h1 class="home-title" id="me-greeting">Welcome back</h1>
                        </div>
                        <p class="home-muted" id="me-stepword"></p>
                    </div>
                    <ol class="journey" id="me-journey" aria-label="Your mentorship journey"></ol>
                </section>

                <div class="home-body">
                    <div class="home-col">
                        <section id="me-next" aria-live="polite"><div class="home-skel"></div></section>

                        <section class="home-section" aria-labelledby="me-matches-h">
                            <div class="home-section-head">
                                <h2 id="me-matches-h">Mentors who fit you</h2>
                                <a class="home-link" href="recommendations.html">See all mentors</a>
                            </div>
                            <div id="me-matches"><div class="home-skel"></div></div>
                        </section>

                        <section class="home-section" aria-labelledby="me-mentorship-h" id="me-mentorship-wrap" hidden>
                            <div class="home-section-head">
                                <h2 id="me-mentorship-h">Your mentorship</h2>
                                <a class="home-link" href="requests.html">My requests</a>
                            </div>
                            <div id="me-mentorship"></div>
                        </section>
                    </div>

                    <aside class="home-col home-side" aria-label="Also for you">
                        <section class="home-section" aria-labelledby="me-events-h">
                            <h2 id="me-events-h">Coming up</h2>
                            <div id="me-events"><div class="home-skel"></div></div>
                        </section>
                        <section class="home-section" aria-labelledby="me-opps-h">
                            <h2 id="me-opps-h">New opportunity</h2>
                            <div id="me-opps"><div class="home-skel"></div></div>
                        </section>
                        <section class="home-section home-guide" aria-labelledby="me-guide-h">
                            <h2 id="me-guide-h">New to AlumNet?</h2>
                            <p>A two-minute guide to finding a mentor and what happens next.</p>
                            <button type="button" class="link-btn home-link" id="me-guide-btn">Read the guide</button>
                        </section>
                    </aside>
                </div>
            </div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
