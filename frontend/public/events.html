<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alumni events AlumNet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <div class="topbar-actions">
            <label class="theme-switch" title="Toggle dark mode">
                <input type="checkbox" id="theme-toggle-checkbox" aria-label="Dark mode">
                <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
            <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">⏻</button>
        </div>

        <aside class="app-sidebar">
            <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
            <nav id="sidebar-nav"></nav>
            <div class="app-sidebar-foot"></div>
        </aside>

        <main class="app-main">
            <div class="app-header">
                <div>
                    <h1>Alumni events</h1>
                    <span class="sub">Register to attend, or check back for what's coming up.</span>
                </div>
            </div>
            <div class="events-toolbar">
                <div class="tabs">
                    <button class="tab active" data-event-filter="all">All events</button>
                    <button class="tab" data-event-filter="mine">My events</button>
                    <button class="tab" data-event-filter="proposals" id="proposals-tab" style="display:none;">My proposals</button>
                </div>
                <button class="btn btn-primary" id="propose-event-btn" style="display:none;">Propose an event</button>
            </div>
            <div class="opportunity-filters" id="event-filters">
                <input type="search" id="event-search" class="search-pill" placeholder="Search title, topic, venue or host" aria-label="Search events">
                <select id="event-format" class="select-pill" aria-label="Format">
                    <option value="">Any format</option>
                    <option value="in_person">In person</option>
                    <option value="virtual">Virtual</option>
                </select>
                <select id="event-when" class="select-pill" aria-label="When">
                    <option value="">Any date</option>
                    <option value="7">In the next 7 days</option>
                    <option value="30">In the next 30 days</option>
                    <option value="90">In the next 3 months</option>
                </select>
            </div>
            <div class="event-grid" id="event-grid"></div>
            <div id="my-proposals" style="display:none;"></div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
