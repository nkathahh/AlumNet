<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mentor Dashboard AlumNet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Menu" aria-expanded="false" aria-controls="app-sidebar">
            <span></span><span></span><span></span>
        </button>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <aside class="app-sidebar" id="app-sidebar">
            <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
            <nav id="sidebar-nav"></nav>
            <div class="app-sidebar-foot"></div>
        </aside>
        <main class="app-main app-main-home">

            <div class="home" id="mentor-dashboard">
                <section class="home-band" aria-labelledby="md-greeting">
                    <div class="home-band-top">
                        <div>
                            <p class="home-date" id="md-date"></p>
                            <h1 class="home-title" id="md-greeting">Welcome back</h1>
                            <p class="home-lead" id="md-sub">Loading your overview...</p>
                        </div>
                        <div class="seats" id="md-seats" aria-labelledby="md-seats-h"></div>
                    </div>
                </section>

                <div class="home-body">
                    <div class="home-col">
                        <div id="md-nudge"></div>
                        <section class="home-section" aria-labelledby="md-pending-h">
                            <div class="home-section-head">
                                <h2 id="md-pending-h">Waiting for your answer</h2>
                                <a class="home-link" href="requests.html">All requests</a>
                            </div>
                            <div id="md-pending"><div class="home-skel"></div></div>
                        </section>

                        <section class="home-section" aria-labelledby="md-mentees-h">
                            <div class="home-section-head">
                                <h2 id="md-mentees-h">Your mentees</h2>
                                <a class="home-link" href="requests.html#accepted">Open workspaces</a>
                            </div>
                            <div id="md-mentees"><div class="home-skel"></div></div>
                        </section>
                    </div>

                    <aside class="home-col home-side" aria-label="Also for you">
                        <section class="home-section" aria-labelledby="md-share-h">
                            <h2 id="md-share-h">Share with the community</h2>
                            <p class="home-muted" style="margin-bottom:12px;">Posts are checked before they go live.</p>
                            <div class="home-actions" id="md-share"></div>
                        </section>
                        <section class="home-section" aria-labelledby="md-contrib-h">
                            <h2 id="md-contrib-h">Your posts</h2>
                            <div id="md-contrib"><div class="home-skel"></div></div>
                        </section>
                        <section class="home-section" aria-labelledby="md-events-h">
                            <h2 id="md-events-h">Coming up</h2>
                            <div id="md-events"><div class="home-skel"></div></div>
                        </section>
                    </aside>
                </div>
            </div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
