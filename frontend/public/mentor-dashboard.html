<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard AlumNet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <div class="topbar-actions">
            <label class="theme-switch" title="Toggle dark mode">
                <input type="checkbox" id="theme-toggle-checkbox">
                <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
            <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">⏻</button>
        </div>
        <aside class="app-sidebar">
            <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
            <nav id="sidebar-nav"></nav>
            <div class="app-sidebar-foot"></div>
        </aside>

        <div class="md" id="mentor-dashboard">
    <header class="md-top">
        <p class="md-date" id="md-date"></p>
        <h1 class="md-greeting" id="md-greeting">Welcome back</h1>
        <p class="md-sub" id="md-sub">Loading your overview...</p>
        <div class="md-actions">
            <a href="events.html" class="btn btn-secondary">Propose an event</a>
            <a href="opportunities.html" class="btn btn-secondary">Post an opportunity</a>
        </div>
    </header>

    <div id="md-nudge"></div>

    <section class="md-kpis" id="md-kpis">
        <div class="md-kpi md-skel"></div>
        <div class="md-kpi md-skel"></div>
        <div class="md-kpi md-skel"></div>
        <div class="md-kpi md-skel"></div>
    </section>

    <div class="md-grid">
        <div class="md-col">
            <section class="md-panel">
                <div class="md-panel-head">
                    <h2>Requests awaiting you</h2>
                    <a href="requests.html">View all</a>
                </div>
                <div id="md-pending"><div class="md-skel md-skel-row"></div><div class="md-skel md-skel-row"></div></div>
            </section>

            <section class="md-panel">
                <div class="md-panel-head">
                    <h2>Your mentees</h2>
                    <a href="requests.html">Manage</a>
                </div>
                <div id="md-mentees"><div class="md-skel md-skel-row"></div></div>
            </section>
        </div>

        <aside class="md-col">
            <section class="md-panel">
                <div class="md-panel-head">
                    <h2>Profile strength</h2>
                    <a href="profile.html">Edit</a>
                </div>
                <div id="md-profile"><div class="md-skel md-skel-row"></div></div>
            </section>

            <section class="md-panel">
                <div class="md-panel-head">
                    <h2>Upcoming events</h2>
                    <a href="events.html">All events</a>
                </div>
                <div id="md-events"><div class="md-skel md-skel-row"></div></div>
            </section>

            <section class="md-panel">
                <div class="md-panel-head">
                    <h2>Your contributions</h2>
                    <a href="opportunities.html">Opportunities</a>
                </div>
                <div id="md-contrib"><div class="md-skel md-skel-row"></div></div>
            </section>
        </aside>
    </div>
</div>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
