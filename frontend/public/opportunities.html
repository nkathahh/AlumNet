<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Career opportunities AlumNet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <div class="topbar-actions">
            <label class="theme-switch" title="Toggle dark mode">
                <input type="checkbox" id="theme-toggle-checkbox">
                <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
            <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">⏻</button>
        </div>
        <aside class="app-sidebar">
            <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
            <nav id="sidebar-nav"></nav>
            <div class="app-sidebar-foot"></div>
        </aside>

        <main class="app-main">
            <div class="app-header">
                <div>
                    <h1>Career opportunities</h1>
                    <span class="sub">Posted by mentors across the network.</span>
                </div>
                <div class="app-toolbar">
                    <button class="btn btn-primary" id="post-opportunity-btn" style="display:none;">Post
                        opportunity</button>
                </div>
            </div>
            <div class="tabs opp-tabs" id="opp-tabs" style="display:none;">
                <button class="tab active" data-opp-view="all">All opportunities</button>
                <button class="tab" data-opp-view="mine">My posts <span class="tab-count" id="my-posts-count"></span></button>
            </div>
            <div class="opportunity-filters" id="opp-filters">
                <input type="search" id="opp-search" class="search-pill" placeholder="Search title, company or keyword">
                <select id="opp-industry" class="select-pill">
                    <option value="">All industries</option>
                    <option>Aviation</option>
                    <option>Ground Operations</option>
                    <option>Logistics</option>
                    <option>Corporate / Support</option>
                    <option>Other</option>
                </select>
                <select id="opp-type" class="select-pill">
                    <option value="">All types</option>
                    <option value="full_time">Full-time</option>
                    <option value="part_time">Part-time</option>
                    <option value="contract">Contract</option>
                    <option value="consultancy">Consultancy</option>
                    <option value="internal_transfer">Internal transfer</option>
                    <option value="volunteer">Volunteer</option>
                </select>
                <select id="opp-poster" class="select-pill" aria-label="Posted by">
                    <option value="">Anyone</option>
                </select>
            </div>
            <div class="filter-chip-row" id="opp-poster-chip"></div>
            <div id="opportunities-list"></div>
            <div id="my-posts" style="display:none;"></div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
