<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile — AlumNet</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand"><span class="mark">KQ</span> AlumNet</div>
    <nav class="nav-group">
      <div class="nav-group-label">Network</div>
      <a class="nav-link" href="recommendations.html">Mentor recommendations</a>
      <a class="nav-link" href="requests.html">Mentorship requests</a>
      <a class="nav-link active" href="profile.html">My profile</a>
    </nav>
    <nav class="nav-group">
      <div class="nav-group-label">Community</div>
      <a class="nav-link" href="events.html">Alumni events</a>
      <a class="nav-link" href="opportunities.html">Career opportunities</a>
      <a class="nav-link" href="notifications.html">Notifications</a>
    </nav>
    <div class="app-sidebar-foot">Alexandra Moreno<br>Former Cabin Crew</div>
  </aside>

  <main class="app-main">
    <div class="app-header">
      <div>
        <h1>My profile</h1>
        <span class="sub">This is what mentors and mentees see matched against.</span>
      </div>
    </div>

    <form id="profile-form" novalidate>
      <div class="field">
        <label for="skills">Skills</label>
        <textarea id="skills" name="skills"></textarea>
      </div>
      <div class="field">
        <label for="experience">Experience</label>
        <textarea id="experience" name="experience"></textarea>
      </div>
      <div class="field">
        <label for="interests">Career interests</label>
        <textarea id="interests" name="interests"></textarea>
      </div>
      <div class="field">
        <label for="industry">Industry</label>
        <select id="industry" name="industry">
          <option>Aviation</option>
          <option>Ground Operations</option>
          <option>Logistics</option>
          <option>Corporate / Support</option>
          <option>Other</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </form>
  </main>
</div>
<script src="js/main.js"></script>
</body>
</html>
