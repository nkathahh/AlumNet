<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — AlumNet</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <aside class="auth-panel">
    <div class="auth-brand">
      <span class="mark">KQ</span> AlumNet
    </div>
    <div class="auth-copy">
      <h1>Welcome back to the network.</h1>
      <p>Pick up your mentor conversations, check on requests and see what's new across events and career openings.</p>
    </div>
    <div class="auth-stat-row">
      <div class="auth-stat">
        <div class="num">8,400+</div>
        <div class="label">Alumni profiles</div>
      </div>
      <div class="auth-stat">
        <div class="num">300+</div>
        <div class="label">Active mentorships</div>
      </div>
    </div>
  </aside>

  <div class="auth-form-side">
    <div class="auth-form-card">
      <h2>Welcome back</h2>
      <span class="sub">Log in with your alumni account.</span>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@kenya-airways.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
        <p id="login-error" style="color:#C8102E; font-size:0.85rem; display:none; margin-bottom:16px;"></p>
      </form>

      <p class="auth-switch">
        <a href="#" id="forgot-link">Forgot password?</a>
      </p>
      <p class="auth-switch">New here? <a href="signup.html">Sign up</a></p>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
